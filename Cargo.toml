[package]
name = "fin-ui"
version = "2.3.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"
fin-shared = { path = "shared" }
web-sys = { version = "0.3", features = [
    "HtmlInputElement", "FileList", "File", "Blob", "Storage", "Node", "Element", "HtmlElement", "DomRect",
    "FocusEvent", "KeyboardEvent", "ScrollIntoViewOptions", "ScrollLogicalPosition",
] }

[workspace]
members = ["src-tauri", "shared"]
# So a plain `cargo test` covers the backend and shared crate too. Trunk builds
# only the frontend because index.html pins `data-bin="fin-ui"`.
default-members = [".", "src-tauri", "shared"]

# Workspace-wide (profiles in member crates are ignored).
# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
